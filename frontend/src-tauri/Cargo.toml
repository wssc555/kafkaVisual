[package]
name = "app"
version = "1.0.0"
description = "Kafka Visualizer desktop shell (Tauri)"
authors = ["kafkaviz"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools:release 包启用 WebView 检查器(排障期保留;稳定后可移除,减体积+收紧面)
tauri = { version = "2.11.6", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
